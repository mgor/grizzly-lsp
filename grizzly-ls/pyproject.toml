[build-system]
requires = ["setuptools==69.2.0", "wheel==0.43.0", "setuptools-scm==8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grizzly-loadtester-ls"
description = "LSP server implementation for grizzly-loadtester load scenario development"
dependencies = [
    'pygls ==1.3.1',
    'behave ==1.2.6',
    'random-word ==1.0.11',
    'colorama ==0.4.6',
    'Jinja2 ==3.1.6',
    'jinja2-simple-tags ==0.6.1',
    'ordered-set ==4.1.0'
]
readme = "README.md"
authors = [
    {name = "biometria", email="opensource@biometria.se"}
]
license = {text = "MIT"}
dynamic = ["version"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython"
]
keywords = [
    "locust",
    "behave",
    "grizzly",
    "grizzly-loadtester",
    "loadtest",
    "load",
    "performance",
    "traffic generator",
    "lsp",
    "vscode"
]

[project.scripts]
grizzly-ls = "grizzly_ls.__main__:main"

[tool.setuptools.package-data]
grizzly_ls = ["py.typed"]

[project.urls]
Documentation = "https://biometria-se.github.io/grizzly/editor-support/"
Code = "https://github.com/biometria-se/grizzly-lsp/"
Tracker = "https://github.com/Biometria-se/grizzly/issues"

[project.optional-dependencies]
dev = [
    'pytest ==8.4.1',
    'coverage[toml] ==7.9.1',
    'pytest-cov ==6.2.1',
    'pytest-mock ==3.14.1',
    'pytest-timeout ==2.4.0',
    'pylint ==3.2.6',
    'flake8-pyproject ==1.2.3',
    'black ==24.8.0',
    'mypy ==1.11.1',
    'requests ==2.32.3',
    'types-requests >=2.27.13,<3.0.0',
    'pip-licenses ==4.3.4',
    'pytablewriter ==1.2.0',
    'types-colorama ==0.4.15.20240311',
    'grizzly-loadtester >=2.10.2'
]

debug = [
    "debugpy ==1.8.1"
]

ci = [
    "build ==1.1.1",
    "twine ==5.0.0"
]

[tool.setuptools_scm]
root = ".."

[tool.pytest.ini_options]
timeout = 300
addopts = [
    "-c", "pyproject.toml",
    "--cov-reset",
    "--cov=src/grizzly_ls",
    "--cov-report=xml:grizzly-ls/.coverage.xml",
    "--no-cov-on-fail"
]
filterwarnings = [
    "ignore:The distutils.*is deprecated.*:DeprecationWarning",
    "ignore:There is no current event loop.*:DeprecationWarning"
]

[tool.mypy]
mypy_path = "types/"

[[tool.mypy.overrides]]
module = "piplicenses.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytablewriter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "re.*"
ignore_missing_imports = true

[tool.coverage.report]
omit = ["src/grizzly_ls/__init__.py"]

[tool.ruff]
exclude = [
    ".env", ".venv", ".pytest_tmp", "build", "dist", "src/grizzly_ls/__version__.py"
]
line-length = 180
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "BLE001",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D213", "D205", "D301", "D407", "D417",
    "DTZ005",
    "E722", "E402",
    "F405", "F403",
    "N801",
    "PD011",
    "PLR2004",
    "UP007", "UP006", "UP045",
    "Q000",
    "S101", "S104", "S314", "S603", "S607", "S701",
    "SLF001",
    "T201",
    "TRY301"
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-args = 10
